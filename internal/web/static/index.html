<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSL2NMOS | TSL 5.0 ⇄ NMOS IS-07 Bidirectional Tally Gateway</title>
<style>
:root {
  --bg: #0b0e14;
  --panel: #131822;
  --panel-alt: #1a2130;
  --border: #283246;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #388bfd;
  --tally-red: #ff2e38;
  --tally-red-glow: rgba(255, 46, 56, 0.45);
  --tally-green: #00e065;
  --tally-green-glow: rgba(0, 224, 101, 0.40);
  --warn: #d29922;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", monospace, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  font-size: 14px;
}
header {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.4px; }
.hdr-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
  background: var(--panel-alt); border: 1px solid var(--border);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--tally-green); box-shadow: 0 0 8px var(--tally-green-glow); }
.dot.warn { background: var(--warn); }
.dot.err { background: var(--tally-red); }
.lang-switch {
  display: inline-flex;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 2px;
  gap: 2px;
}
.lang-switch button {
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.12s;
}
.lang-switch button:hover { color: var(--text); border-color: transparent; }
.lang-switch button.active { background: #1f6feb; color: #fff; }
.tabs {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px 0;
  border-bottom: 1px solid var(--border); background: var(--panel);
}
.tab-btn {
  background: transparent; color: var(--muted); border: none;
  padding: 9px 15px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  border-bottom: 2px solid transparent; border-radius: 0; transition: 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
main { max-width: 1480px; margin: 0 auto; padding: 18px 20px 40px; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.stats-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px; margin-bottom: 18px;
}
.stat-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 15px;
}
.stat-card .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.stat-card .val { font-size: 15px; font-weight: 700; word-break: break-all; }
.stat-card .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.toolbar {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
  gap: 10px; margin-bottom: 14px;
}
button, select, input {
  font-family: inherit; font-size: 13px; color: var(--text);
  background: var(--panel-alt); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 11px;
}
button { cursor: pointer; font-weight: 600; transition: 0.12s; }
button:hover { border-color: var(--accent); }
button.primary { background: #1f6feb; border-color: #388bfd; color: #fff; }
button.primary:hover { background: #388bfd; }
button.danger { background: rgba(255,46,56,0.14); border-color: #ff2e38; color: #ff7b82; }
.matrix-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
  gap: 12px;
}
.cam-card {
  background: var(--panel); border: 2px solid var(--border);
  border-radius: 8px; padding: 12px; transition: 0.1s;
  display: flex; flex-direction: column; gap: 9px;
}
.cam-card.pgm {
  border-color: var(--tally-red);
  box-shadow: 0 0 18px var(--tally-red-glow);
}
.cam-card.pvw:not(.pgm) {
  border-color: var(--tally-green);
  box-shadow: 0 0 14px var(--tally-green-glow);
}
.cam-head { display: flex; justify-content: space-between; align-items: center; }
.cam-title { font-weight: 700; font-size: 15px; }
.cam-idx { font-size: 11.5px; color: var(--muted); font-family: monospace; }
.umd-box {
  background: #07090d; border: 1px solid #212836; border-radius: 5px;
  padding: 5px 8px; font-family: monospace; font-size: 13px;
  color: #ffd33d; min-height: 28px; display: flex; justify-content: space-between; align-items: center;
}
.lamps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lamp {
  text-align: center; padding: 6px 0; border-radius: 5px;
  font-weight: 700; font-size: 12.5px; letter-spacing: 0.5px;
  background: #171c26; color: #566070; border: 1px solid #252d3d;
}
.lamp.red-on {
  background: var(--tally-red); color: #fff; border-color: #ff6b72;
  box-shadow: 0 0 12px var(--tally-red-glow);
}
.lamp.green-on {
  background: var(--tally-green); color: #042412; border-color: #5aff9f;
  box-shadow: 0 0 12px var(--tally-green-glow);
}
.ov-btns { display: flex; gap: 4px; }
.ov-btns button { flex: 1; padding: 4px 2px; font-size: 11.5px; }
.ov-btns button.active-ov { border-color: #ffd33d; color: #ffd33d; background: rgba(255,211,61,0.12); }
.mini-ov { display: inline-flex; gap: 3px; align-items: center; margin-left: 6px; }
.mini-ov button { padding: 2px 6px; font-size: 11px; }
.mini-ov button.active-ov { border-color: #ffd33d; color: #ffd33d; background: rgba(255,211,61,0.14); }
.gpi-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 700;
  border: 1px solid var(--border); background: #171c26; color: var(--muted);
}
.gpi-pill.on {
  background: rgba(0, 224, 101, 0.18); color: #5aff9f; border-color: var(--tally-green);
}
.card-panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; margin-bottom: 16px;
}
.card-panel h2 { font-size: 15px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 9px; border-bottom: 1px solid var(--border); text-align: left; }
th { color: var(--muted); font-weight: 600; background: rgba(255,255,255,0.02); white-space: nowrap; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.tag-pill {
  display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11.5px; font-weight: 700;
}
.tag-RED { background: rgba(255,46,56,0.22); color: #ff6b72; }
.tag-GREEN { background: rgba(0,224,101,0.2); color: #3fb950; }
.tag-AMBER { background: rgba(210,153,34,0.25); color: #e3b341; }
.tag-OFF { background: #1c2230; color: #6e7681; }
.form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.toast {
  position: fixed; right: 20px; bottom: 20px; padding: 10px 16px;
  border-radius: 6px; background: #1f6feb; color: #fff; font-weight: 600;
  display: none; z-index: 999; box-shadow: 0 6px 20px rgba(0,0,0,0.45);
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>TSL2NMOS</h1>
    <span class="badge"><span id="sseDot" class="dot"></span><span id="sseText"></span></span>
    <span class="badge" id="wsBadge"><span id="wsDot" class="dot"></span><span id="wsText"></span></span>
    <span class="badge" id="n2tBadge"><span id="n2tDot" class="dot"></span><span id="n2tText"></span></span>
  </div>
  <div class="hdr-right">
    <div class="mono" style="color:var(--muted)" id="hdrEndpoints"></div>
    <div class="lang-switch" role="group" aria-label="Language Switcher">
      <button type="button" id="langBtnZh" onclick="setLang('zh')">中文</button>
      <button type="button" id="langBtnEn" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('matrix', this)" data-i18n="tab_matrix"></button>
  <button class="tab-btn" onclick="switchTab('targets', this)" data-i18n="tab_targets"></button>
  <button class="tab-btn" onclick="switchTab('nmos2tsl', this)" data-i18n="tab_nmos2tsl"></button>
  <button class="tab-btn" onclick="switchTab('channels', this)" data-i18n="tab_channels"></button>
  <button class="tab-btn" onclick="switchTab('sniffer', this)" data-i18n="tab_sniffer"></button>
</div>

<main>
  <!-- TAB 1: LIVE TALLY MATRIX (TSL -> NMOS) -->
  <div id="tab-matrix" class="tab-pane active">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="lbl" data-i18n="stat_tsl_title"></div>
        <div class="val mono" id="stTslAddr">-</div>
        <div class="sub" id="stTslPkts">-</div>
      </div>
      <div class="stat-card">
        <div class="lbl" data-i18n="stat_ws_title"></div>
        <div class="val mono" id="stWsUri">-</div>
        <div class="sub" id="stWsClients">-</div>
      </div>
      <div class="stat-card">
        <div class="lbl" data-i18n="stat_reg_title"></div>
        <div class="val" id="stRegState">-</div>
        <div class="sub mono" id="stRegUrl">-</div>
      </div>
      <div class="stat-card">
        <div class="lbl" data-i18n="stat_bind_title"></div>
        <div class="val" id="stBindSummary">-</div>
        <div class="sub" id="stUptime">-</div>
      </div>
    </div>

    <div class="toolbar">
      <div style="color:var(--muted);font-size:13px;" data-i18n-html="matrix_tip_html"></div>
      <div style="display:flex;gap:8px;">
        <button onclick="setOverride(0, 'auto')" data-i18n="btn_all_auto"></button>
        <button onclick="setOverride(0, 'force_off')" data-i18n="btn_all_off"></button>
      </div>
    </div>

    <div id="matrixGrid" class="matrix-grid"></div>
  </div>

  <!-- TAB 2: IS-05 DIRECT GPO PATCHING (TSL -> NMOS) -->
  <div id="tab-targets" class="tab-pane">
    <div class="card-panel">
      <h2>
        <span data-i18n="targets_add_title"></span>
        <button onclick="scanMDNSNodes('target')" data-i18n="btn_mdns_scan"></button>
      </h2>
      <div id="mdnsResult" style="margin-bottom:10px;display:none;"></div>
      <div class="form-row">
        <div class="field" style="flex:1;min-width:260px;">
          <label data-i18n="lbl_target_url"></label>
          <input type="text" id="inpTargetUrl" data-i18n-placeholder="ph_target_url">
        </div>
        <div class="field" style="min-width:200px;">
          <label data-i18n="lbl_target_label"></label>
          <input type="text" id="inpTargetLabel" data-i18n-placeholder="ph_target_label">
        </div>
        <button class="primary" onclick="addAndInspectTarget()" data-i18n="btn_probe_add"></button>
      </div>
    </div>

    <div id="targetsContainer"></div>

    <div class="card-panel">
      <h2>
        <span data-i18n="ws_sessions_title"></span>
        <button onclick="resyncTargets()" data-i18n="btn_resync_all"></button>
      </h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="th_ws_remote"></th>
              <th data-i18n="th_ws_conn_at"></th>
              <th data-i18n="th_ws_health"></th>
              <th data-i18n="th_ws_subs"></th>
            </tr>
          </thead>
          <tbody id="wsClientsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- TAB 3: NMOS -> TSL REVERSE GATEWAY (GPI IN -> TSL OUT) -->
  <div id="tab-nmos2tsl" class="tab-pane">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="lbl" data-i18n="n2t_stat_tx_title"></div>
        <div class="val mono" id="stN2TTxState">-</div>
        <div class="sub" id="stN2TTxPkts">-</div>
      </div>
      <div class="stat-card">
        <div class="lbl" data-i18n="n2t_stat_ws_title"></div>
        <div class="val" id="stN2TSubSess">-</div>
        <div class="sub" id="stN2TSubSrcs">-</div>
      </div>
      <div class="stat-card">
        <div class="lbl" data-i18n="n2t_stat_bind_title"></div>
        <div class="val" id="stN2TBindSummary">-</div>
        <div class="sub" id="stN2TRcvExpose">-</div>
      </div>
    </div>

    <!-- TSL Output Settings -->
    <div class="card-panel" oninput="markN2TDirty()" onchange="markN2TDirty()">
      <h2>
        <span><span data-i18n="n2t_cfg_title"></span> <span id="n2tDirtyHint" style="display:none;color:var(--warn);font-size:12.5px;margin-left:8px;" data-i18n="cfg_dirty_hint"></span></span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" onclick="fillSimplyLiveTSLInput()" data-i18n="n2t_btn_fill_sl"></button>
          <button type="button" class="primary" onclick="saveN2TConfig()" data-i18n="btn_save_apply"></button>
        </div>
      </h2>
      <div class="form-row">
        <div class="field">
          <label data-i18n="n2t_lbl_enabled"></label>
          <select id="n2tEnabled">
            <option value="false" data-i18n="n2t_opt_disabled"></option>
            <option value="true" data-i18n="n2t_opt_enabled"></option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="n2t_lbl_transport"></label>
          <select id="n2tTransport">
            <option value="udp" data-i18n="n2t_opt_tr_udp"></option>
            <option value="tcp_client" data-i18n="n2t_opt_tr_tcp_cli"></option>
            <option value="tcp_server" data-i18n="n2t_opt_tr_tcp_srv"></option>
          </select>
        </div>
        <div class="field" style="min-width:240px;flex:1;">
          <label data-i18n="n2t_lbl_target_addr"></label>
          <input type="text" id="n2tTargetAddr" data-i18n-placeholder="n2t_ph_target_addr">
        </div>
        <div class="field">
          <label data-i18n="n2t_lbl_protocol"></label>
          <select id="n2tProtocol">
            <option value="v5.0" data-i18n="n2t_opt_proto_50"></option>
            <option value="v3.1" data-i18n="n2t_opt_proto_31"></option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field" style="min-width:260px;">
          <label data-i18n="n2t_lbl_lamp_map"></label>
          <select id="n2tLampMap">
            <option value="lh_red_rh_green" data-i18n="n2t_opt_lamp_sl"></option>
            <option value="rh_red_lh_green" data-i18n="n2t_opt_lamp_classic"></option>
            <option value="both_color" data-i18n="n2t_opt_lamp_both"></option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="n2t_lbl_txt_follow"></label>
          <select id="n2tTxtFollow">
            <option value="false" data-i18n="n2t_opt_txt_off"></option>
            <option value="true" data-i18n="n2t_opt_txt_on"></option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="n2t_lbl_repeat_ms"></label>
          <input type="number" id="n2tRepeatMs" min="0" max="60000" step="100" style="width:130px;">
        </div>
        <div class="field">
          <label data-i18n="n2t_lbl_expose_rcv"></label>
          <select id="n2tExposeRcv">
            <option value="true" data-i18n="n2t_opt_expose_on"></option>
            <option value="false" data-i18n="n2t_opt_expose_off"></option>
          </select>
        </div>
      </div>
    </div>

    <!-- Live Outbound TSL Preview Matrix -->
    <div class="card-panel">
      <h2>
        <span data-i18n="n2t_preview_title"></span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" onclick="setN2TOverride('*', 'auto')" data-i18n="btn_all_auto"></button>
          <button type="button" onclick="setN2TOverride('*', 'force_off')" data-i18n="btn_all_off"></button>
        </div>
      </h2>
      <div style="color:var(--muted);font-size:12.5px;margin-bottom:12px;" data-i18n-html="n2t_preview_tip_html"></div>
      <div id="n2tDisplayGrid" class="matrix-grid"></div>
    </div>

    <!-- Scan / Add NMOS GPI Source Device -->
    <div class="card-panel">
      <h2>
        <span data-i18n="n2t_add_src_title"></span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" onclick="reuseExistingTargetForGPI()" data-i18n="n2t_btn_reuse_dev"></button>
          <button type="button" onclick="scanMDNSNodes('nmos2tsl')" data-i18n="btn_mdns_scan"></button>
        </div>
      </h2>
      <div id="n2tMdnsResult" style="margin-bottom:10px;display:none;"></div>
      <div class="form-row">
        <div class="field" style="flex:1;min-width:260px;">
          <label data-i18n="n2t_lbl_src_url"></label>
          <input type="text" id="inpN2TSrcUrl" data-i18n-placeholder="ph_target_url">
        </div>
        <div class="field" style="min-width:200px;">
          <label data-i18n="lbl_target_label"></label>
          <input type="text" id="inpN2TSrcLabel" data-i18n-placeholder="n2t_ph_src_label">
        </div>
        <button class="primary" onclick="addAndInspectN2TSource()" data-i18n="n2t_btn_probe_gpi"></button>
      </div>
    </div>

    <!-- Per-Device GPI Mapping Cards -->
    <div id="n2tSourcesContainer"></div>

    <!-- Active Outbound IS-07 WebSocket Subscriber Sessions -->
    <div class="card-panel">
      <h2>
        <span data-i18n="n2t_sessions_title"></span>
        <button onclick="resyncN2T()" data-i18n="n2t_btn_resync"></button>
      </h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="n2t_th_ws_uri"></th>
              <th data-i18n="n2t_th_ws_state"></th>
              <th data-i18n="th_ws_conn_at"></th>
              <th data-i18n="th_ws_health"></th>
              <th data-i18n="th_ws_subs"></th>
            </tr>
          </thead>
          <tbody id="n2tSessionsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- TAB 4: CHANNELS & TSL RULES -->
  <div id="tab-channels" class="tab-pane">
    <div class="card-panel" oninput="markCfgDirty()" onchange="markCfgDirty()">
      <h2>
        <span><span data-i18n="cfg_global_title"></span> <span id="cfgDirtyHint" style="display:none;color:var(--warn);font-size:12.5px;margin-left:8px;" data-i18n="cfg_dirty_hint"></span></span>
        <button class="primary" onclick="saveFullConfig()" data-i18n="btn_save_apply"></button>
      </h2>
      <div class="form-row">
        <div class="field">
          <label data-i18n="lbl_tsl_mode"></label>
          <select id="cfgTslMode" onchange="toggleTslModeFields()">
            <option value="listen" data-i18n="opt_tsl_listen"></option>
            <option value="tcp_client" data-i18n="opt_tsl_tcp"></option>
            <option value="udp_client" data-i18n="opt_tsl_udp"></option>
          </select>
        </div>
        <div class="field" id="fldTslListen">
          <label data-i18n="lbl_tsl_listen"></label>
          <input type="text" id="cfgTslListen" placeholder="0.0.0.0:8901">
        </div>
        <div class="field" id="fldTslRemote" style="display:none;min-width:220px;">
          <label data-i18n="lbl_tsl_remote"></label>
          <input type="text" id="cfgTslRemote" data-i18n-placeholder="ph_tsl_remote">
        </div>
        <div class="field">
          <label data-i18n="lbl_host_ip"></label>
          <input type="text" id="cfgHostIp">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label data-i18n="lbl_rule_mode"></label>
          <select id="cfgRuleMode">
            <option value="any_color" data-i18n="opt_rule_any"></option>
            <option value="rh_pgm_lh_pvw" data-i18n="opt_rule_rh_lh"></option>
            <option value="lh_pgm_rh_pvw" data-i18n="opt_rule_lh_rh"></option>
            <option value="rh_only" data-i18n="opt_rule_rh"></option>
            <option value="lh_only" data-i18n="opt_rule_lh"></option>
            <option value="text_only" data-i18n="opt_rule_text"></option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="lbl_pgm_over_pvw"></label>
          <select id="cfgPgmOverPvw">

function detectInitialLang() {
  try {
    const q = new URLSearchParams(window.location.search).get('lang');
    if (q === 'en' || q === 'zh') {
      localStorage.setItem('tsl2nmos_lang', q);
      return q;
    }
    const saved = localStorage.getItem('tsl2nmos_lang');
    if (saved === 'en' || saved === 'zh') return saved;
  } catch (_) {}
  const nav = (navigator.language || '').toLowerCase();
  return nav.startsWith('zh') ? 'zh' : 'en';
}

let currentLang = detectInitialLang();
let sseState = 'connecting'; // 'connecting' | 'online' | 'reconnecting'
let mdnsScanState = {target: null, nmos2tsl: null};
let appConfig = null;
let latestStatus = null;
let latestN2T = null;
let snifferRows = [];
let inspectedCache = {};
let autoStartChByTarget = {};
let autoStartIdxByN2TSrc = {};

function t(key, params) {
  const dict = I18N[currentLang] || I18N.zh;
  let str = dict[key] ?? I18N.zh[key] ?? key;
  if (params) {
    for (const [k, v] of Object.entries(params)) {
      str = str.replaceAll('{' + k + '}', String(v));
    }
  }
  return str;
}

function setLang(lang) {
  currentLang = (lang === 'en') ? 'en' : 'zh';
  try { localStorage.setItem('tsl2nmos_lang', currentLang); } catch (_) {}
  applyLang();
}

function applyLang() {
  document.documentElement.lang = (currentLang === 'en') ? 'en' : 'zh-CN';
  document.title = t('doc_title');
  document.getElementById('langBtnZh').classList.toggle('active', currentLang === 'zh');
  document.getElementById('langBtnEn').classList.toggle('active', currentLang === 'en');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });

  updateSSEBadge();
  renderMDNSBox('target');
  renderMDNSBox('nmos2tsl');

  if (latestStatus) {
    renderStatus(latestStatus);
  } else {
    document.getElementById('wsText').textContent = t('ws_badge', {n: 0});
    document.getElementById('n2tText').textContent = t('n2t_badge_off');
    document.getElementById('stTslPkts').textContent = t('stat_tsl_pkts', {pkts: 0, msgs: 0, errs: 0});
    document.getElementById('stWsClients').textContent = t('stat_ws_clients', {n: 0});
    document.getElementById('stUptime').textContent = t('stat_uptime', {t: '0h 0m 0s'});
    renderWSClients([]);
    renderN2TSummary(null);
  }
  if (appConfig) {
    renderChannelsCfgTable();
    renderTargetsSection(true);
    renderN2TSourcesSection(true);
  }
  renderSnifferTable();
}

function updateSSEBadge() {
  const dot = document.getElementById('sseDot');
  const txt = document.getElementById('sseText');
  if (sseState === 'online') {
    dot.className = 'dot ok';
    txt.textContent = t('sse_online');
  } else if (sseState === 'reconnecting') {
    dot.className = 'dot err';
    txt.textContent = t('sse_reconnecting');
  } else {
    dot.className = 'dot';
    txt.textContent = t('sse_connecting');
  }
}

function showToast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = isErr ? '#da3633' : '#1f6feb';
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 2800);
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  const isDirty = (document.getElementById('cfgDirtyHint')?.style.display !== 'none') ||
                  (document.getElementById('n2tDirtyHint')?.style.display !== 'none');
  if ((name === 'channels' || name === 'targets' || name === 'nmos2tsl') && (!appConfig || !isDirty)) {
    loadConfig();
  }
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

function renderStatus(st) {
  latestStatus = st;
  document.getElementById('hdrEndpoints').textContent = `Node: ${st.node_id.slice(0,8)}… | HTTP: ${st.advertised_http}`;

  const tslConn = (currentLang === 'en' ? (st.tsl_stats.connection_state_en || st.tsl_stats.connection_state) : st.tsl_stats.connection_state) || st.tsl_stats.listen_addr;
  document.getElementById('stTslAddr').textContent = tslConn;
  document.getElementById('stTslPkts').textContent =
    t('stat_tsl_pkts', {
      pkts: st.tsl_stats.total_packets,
      msgs: st.tsl_stats.total_messages,
      errs: st.tsl_stats.parse_errors
    }) + (st.tsl_stats.last_source_addr ? t('stat_tsl_src', {src: st.tsl_stats.last_source_addr}) : '');

  document.getElementById('stWsUri').textContent = st.advertised_ws;
  const wsCount = (st.ws_clients || []).length;
  document.getElementById('stWsClients').textContent = t('stat_ws_clients', {n: wsCount});
  document.getElementById('wsText').textContent = t('ws_badge', {n: wsCount});
  document.getElementById('wsDot').className = 'dot ' + (wsCount > 0 ? 'ok' : '');

  const reg = st.registry_status || {};
  if (reg.mode === 'disabled') {
    document.getElementById('stRegState').textContent = t('reg_disabled');
    document.getElementById('stRegUrl').textContent = t('reg_disabled_sub');
  } else if (reg.registered) {
    document.getElementById('stRegState').textContent = t('reg_online');
    document.getElementById('stRegUrl').textContent = reg.active_registry_url || '';
  } else {
    document.getElementById('stRegState').textContent = t('reg_p2p');
    document.getElementById('stRegUrl').textContent = reg.last_error || t('reg_p2p_sub');
  }

  const binds = (st.binding_statuses || []).filter(b => b.enabled);
  const okBinds = binds.filter(b => b.patched).length;
  document.getElementById('stBindSummary').textContent = binds.length
    ? t('stat_bind_active', {ok: okBinds, total: binds.length})
    : t('stat_bind_none');
  document.getElementById('stUptime').textContent = t('stat_uptime', {t: formatUptime(st.uptime_sec)});

  renderChannels(st.channels || []);
  renderWSClients(st.ws_clients || []);
  if (appConfig) renderTargetsSection(false);
  if (st.nmos2tsl) renderN2TSummary(st.nmos2tsl);
}

function formatUptime(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return `${h}h ${m}m ${s}s`;
}

}

function clearCfgDirty() {

function populateN2TConfigForm() {
  if (!appConfig) return;
  ensureN2TConfigDefaults();
  clearN2TDirty();
  const out = appConfig.nmos_to_tsl.output;
  document.getElementById('n2tEnabled').value = String(!!out.enabled);
  document.getElementById('n2tTransport').value = out.transport || 'udp';
  document.getElementById('n2tTargetAddr').value = out.target_addr || '192.168.42.15:9001';
  document.getElementById('n2tProtocol').value = out.protocol || 'v5.0';
  document.getElementById('n2tLampMap').value = out.lamp_mapping || 'lh_red_rh_green';
  document.getElementById('n2tTxtFollow').value = String(!!out.text_follows_tally);
  document.getElementById('n2tRepeatMs').value = (out.repeat_interval_ms ?? 1000);
  document.getElementById('n2tExposeRcv').value = String(appConfig.nmos_to_tsl.expose_is04_receivers !== false);
}

function readN2TFormIntoConfig() {
  if (!appConfig) return;
  ensureN2TConfigDefaults();
  const out = appConfig.nmos_to_tsl.output;
  out.enabled = document.getElementById('n2tEnabled').value === 'true';
  out.transport = document.getElementById('n2tTransport').value;
  out.target_addr = document.getElementById('n2tTargetAddr').value.trim();
  out.protocol = document.getElementById('n2tProtocol').value;
  out.lamp_mapping = document.getElementById('n2tLampMap').value;
  out.text_follows_tally = document.getElementById('n2tTxtFollow').value === 'true';
  const rep = parseInt(document.getElementById('n2tRepeatMs').value);
  out.repeat_interval_ms = Number.isNaN(rep) ? 1000 : Math.max(0, rep);
  if (!out.brightness) out.brightness = 3;
  appConfig.nmos_to_tsl.expose_is04_receivers = document.getElementById('n2tExposeRcv').value === 'true';
}

function fillSimplyLiveTSLInput() {
  let host = '192.168.42.15';
  const lastSrc = latestStatus?.tsl_stats?.last_source_addr || '';
  if (lastSrc && !lastSrc.startsWith('sim://')) {
    const idx = lastSrc.lastIndexOf(':');
    if (idx > 0) {
      const cand = lastSrc.slice(0, idx).replace(/^\[|\]$/g, '');
      if (cand && cand !== '127.0.0.1' && cand !== '::1') host = cand;
    }
  }
  const addr = host + ':9001';
  document.getElementById('n2tTransport').value = 'udp';
  document.getElementById('n2tTargetAddr').value = addr;
  document.getElementById('n2tProtocol').value = 'v5.0';
  document.getElementById('n2tLampMap').value = 'lh_red_rh_green';
  markN2TDirty();
  showToast(t('n2t_toast_filled_sl', {addr}));
}

function renderMDNSBox(scope = 'target') {
  const boxId = (scope === 'nmos2tsl') ? 'n2tMdnsResult' : 'mdnsResult';
  const urlId = (scope === 'nmos2tsl') ? 'inpN2TSrcUrl' : 'inpTargetUrl';
  const lblId = (scope === 'nmos2tsl') ? 'inpN2TSrcLabel' : 'inpTargetLabel';
  const box = document.getElementById(boxId);
  const st = mdnsScanState[scope];
  if (!box) return;
  if (!st) {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  if (st.type === 'scanning') {
    box.innerHTML = `<span style="color:var(--muted)">${esc(t('mdns_scanning'))}</span>`;
  } else if (st.type === 'empty') {
    box.innerHTML = `<span style="color:var(--muted)">${esc(t('mdns_empty'))}</span>`;
  } else if (st.type === 'found') {
    box.innerHTML = esc(t('mdns_found')) + st.nodes.map(n =>
      `<button style="margin:2px 4px" onclick="document.getElementById('${urlId}').value='${esc(n.base_url)}';document.getElementById('${lblId}').value='${esc(n.instance)}'">${esc(n.instance)} (${esc(n.base_url)})</button>`
    ).join('');
  } else if (st.type === 'error') {
    box.innerHTML = '<span style="color:#ff7b82">' + esc(st.err) + '</span>';
  }
}

async function scanMDNSNodes(scope = 'target') {
  mdnsScanState[scope] = {type: 'scanning'};
  renderMDNSBox(scope);
  try {
    const raw = await api('/api/v1/mdns/nodes?scan=1');
    const nodes = Array.isArray(raw) ? raw : [];
    if (!nodes.length) {
      mdnsScanState[scope] = {type: 'empty'};
    } else {
      mdnsScanState[scope] = {type: 'found', nodes};
    }
  } catch (e) {
    mdnsScanState[scope] = {type: 'error', err: e.message};
  }
  renderMDNSBox(scope);
}

async function addAndInspectTarget() {
  const rawUrl = document.getElementById('inpTargetUrl').value.trim();
  const label = document.getElementById('inpTargetLabel').value.trim();
  if (!rawUrl) return showToast(t('toast_enter_url'), true);
  if (!appConfig) await loadConfig();

  try {
    const info = await api('/api/v1/targets/inspect', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({base_url: rawUrl})
    });
    inspectedCache[info.base_url] = info.receivers || [];
    let existing = (appConfig.direct_targets || []).find(t => t.base_url === info.base_url);
    if (!existing) {
      const bindings = (info.receivers || []).map(r => ({
        receiver_id: r.id,
        receiver_label: r.label,
        channel_id: 1,
        color: 'red',
        enabled: false
      }));
      existing = {
        id: 'target-' + Date.now(),
        label: label || info.node_label || info.base_url,
        base_url: info.base_url,
        enabled: true,
        auto_heal_interval_sec: 10,
        bindings
      };
      appConfig.direct_targets = appConfig.direct_targets || [];
      appConfig.direct_targets.push(existing);
    } else {
      syncTargetReceivers(existing, info.receivers || []);
    }
    await persistTargetsOnly(t('toast_probed', {n: (info.receivers || []).length}));
  } catch (e) {
    showToast(t('toast_probe_err', {err: e.message}), true);
  }
}

function syncTargetReceivers(target, receivers) {
  const byId = {};
  (target.bindings || []).forEach(b => { byId[b.receiver_id] = b; });
  target.bindings = receivers.map(r => byId[r.id] || {
    receiver_id: r.id,
    receiver_label: r.label,
    channel_id: 1,
    color: 'red',
    enabled: false
  });
}

async function refreshTargetInspect(tIdx) {

  try {
    const info = await api('/api/v1/targets/inspect', {

    });
    const rcvs = Array.isArray(info.receivers) ? info.receivers : [];
    syncTargetReceivers(tgt, rcvs);
    renderTargetsSection();
    showToast(t('toast_refreshed_gpo', {n: rcvs.length}));
  } catch (e) { showToast(t('toast_refresh_err', {err: e.message}), true); }
}

function autoMapDualTally(tIdx) {
  const tgt = appConfig.direct_targets[tIdx];
  const channels = appConfig.channels || [];
  if (!channels.length) return showToast(t('toast_need_ch'), true);

  const selEl = document.getElementById('autoStartCh_' + tIdx);
  const startChId = selEl ? parseInt(selEl.value) : channels[0].id;
  autoStartChByTarget[tgt.id] = startChId;

  let startIdx = channels.findIndex(c => c.id === startChId);
  if (startIdx < 0) startIdx = 0;

  let mappedCount = 0;
  (tgt.bindings || []).forEach((b, i) => {
    const chPos = startIdx + Math.floor(i / 2);
    if (chPos < channels.length) {
      b.channel_id = channels[chPos].id;
      b.color = (i % 2 === 0) ? 'red' : 'green';
      b.enabled = true;
      mappedCount++;
    } else {
      b.enabled = false;
    }
  });
  renderTargetsSection(true);
  showToast(t('toast_auto_mapped', {
    id: channels[startIdx].id,
    name: channels[startIdx].name,
    n: mappedCount
  }));
}

function renderTargetsSection(force = true) {
  const container = document.getElementById('targetsContainer');
  if (!force && document.activeElement && container.contains(document.activeElement)) {
    return;
  }
  if (!appConfig || !(appConfig.direct_targets || []).length) {
    container.innerHTML = `<div class="card-panel" style="color:var(--muted)">${esc(t('targets_empty'))}</div>`;
    return;
  }

  const stMap = {};
  if (latestStatus && latestStatus.binding_statuses) {
    latestStatus.binding_statuses.forEach(s => { stMap[s.target_id + '|' + s.receiver_id] = s; });
  }
  const channels = appConfig.channels || [];

  container.innerHTML = appConfig.direct_targets.map((tgt, tIdx) => {
    const defaultStartId = channels.length ? channels[0].id : 1;
    const selStartId = autoStartChByTarget[tgt.id] || defaultStartId;
    const startOpts = channels.map(c =>
      `<option value="${c.id}" ${c.id===selStartId?'selected':''}>${esc(t('opt_start_ch', {id: c.id, name: c.name}))}</option>`
    ).join('');

    const rows = (tgt.bindings || []).map((b, bIdx) => {
      const rt = stMap[tgt.id + '|' + b.receiver_id] || {};
      let statusHtml = `<span style="color:var(--muted)">${esc(t('st_disabled'))}</span>`;
      if (tgt.enabled && b.enabled) {
        if (rt.patched) statusHtml = `<span style="color:var(--tally-green);font-weight:700">${esc(t('st_patched'))}</span>`;
        else if (rt.last_error) statusHtml = `<span style="color:var(--tally-red)" title="${esc(rt.last_error)}">✖ ${esc(rt.last_error.slice(0,42))}</span>`;
        else statusHtml = `<span style="color:var(--warn)">${esc(t('st_patching'))}</span>`;
      }
      const chOpts = channels.map(c => `<option value="${c.id}" ${c.id===b.channel_id?'selected':''}>#${c.id} ${esc(c.name)} (Idx:${c.index})</option>`).join('');
      return `
        <tr>
          <td><input type="checkbox" ${b.enabled?'checked':''} onchange="appConfig.direct_targets[${tIdx}].bindings[${bIdx}].enabled=this.checked"></td>
          <td><b>${esc(b.receiver_label || 'GPO')}</b><div class="mono" style="font-size:11px;color:var(--muted)">${esc(b.receiver_id)}</div></td>
          <td><select onchange="appConfig.direct_targets[${tIdx}].bindings[${bIdx}].channel_id=parseInt(this.value)">${chOpts}</select></td>
          <td>
            <select onchange="appConfig.direct_targets[${tIdx}].bindings[${bIdx}].color=this.value">
              <option value="red" ${b.color==='red'?'selected':''}>${esc(t('opt_color_red'))}</option>
              <option value="green" ${b.color==='green'?'selected':''}>${esc(t('opt_color_green'))}</option>
            </select>
          </td>
          <td>${statusHtml}</td>
        </tr>`;
    }).join('');

    return `
      <div class="card-panel">
        <h2>
          <span>
            <input type="checkbox" ${tgt.enabled?'checked':''} onchange="appConfig.direct_targets[${tIdx}].enabled=this.checked">
            ${esc(tgt.label)} <span class="mono" style="color:var(--muted);font-weight:400">(${esc(tgt.base_url)})</span>

function renderN2TSummary(n2t) {
  latestN2T = n2t;
  if (latestStatus && n2t) latestStatus.nmos2tsl = n2t;

  const tx = n2t?.tx_stats || {};
  const sessions = n2t?.sessions || [];
  const bindings = n2t?.bindings || [];
  const displays = n2t?.displays || [];

  const enabledBinds = bindings.filter(b => b.enabled);
  const subOkBinds = enabledBinds.filter(b => b.subscribed);
  const connSessions = sessions.filter(s => s.connected);
  const totalSubSrcs = sessions.reduce((acc, s) => acc + (s.subscribed_sources || 0), 0);

  // Header badge
  const n2tDot = document.getElementById('n2tDot');
  const n2tText = document.getElementById('n2tText');
  if (tx.enabled) {
    n2tDot.className = 'dot ' + (tx.connected ? 'ok' : 'warn');
    n2tText.textContent = t('n2t_badge_on', {n: subOkBinds.length});
  } else {
    n2tDot.className = 'dot';
    n2tText.textContent = t('n2t_badge_off');
  }

  // Stats cards
  const txStateStr = (currentLang === 'en' ? (tx.connection_state_en || tx.connection_state) : tx.connection_state) || '-';
  document.getElementById('stN2TTxState').textContent = txStateStr;
  document.getElementById('stN2TTxPkts').textContent = t('n2t_stat_tx_pkts', {
    pkts: tx.total_packets || 0,
    msgs: tx.total_messages || 0,
    errs: tx.send_errors || 0
  });

  document.getElementById('stN2TSubSess').textContent = sessions.length
    ? t('n2t_stat_ws_val', {ok: connSessions.length, total: sessions.length})
    : t('n2t_stat_ws_none');
  document.getElementById('stN2TSubSrcs').textContent = t('n2t_stat_ws_sub', {n: totalSubSrcs});

  document.getElementById('stN2TBindSummary').textContent = enabledBinds.length
    ? t('n2t_stat_bind_active', {ok: subOkBinds.length, total: enabledBinds.length})
    : t('n2t_stat_bind_none');
  const expOn = appConfig ? (appConfig.nmos_to_tsl?.expose_is04_receivers !== false) : true;
  document.getElementById('stN2TRcvExpose').textContent = expOn ? t('n2t_stat_expose_on') : t('n2t_stat_expose_off');

  renderN2TDisplays(displays);
  renderN2TSessions(sessions);
  if (appConfig) renderN2TSourcesSection(false);
}

async function addAndInspectN2TSource() {
  const rawUrl = document.getElementById('inpN2TSrcUrl').value.trim();
  const label = document.getElementById('inpN2TSrcLabel').value.trim();
  if (!rawUrl) return showToast(t('toast_enter_url'), true);
  if (!appConfig) await loadConfig();
  ensureN2TConfigDefaults();

  try {
    const info = await api('/api/v1/nmos2tsl/sources/inspect', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({base_url: rawUrl})
    });
    const list = appConfig.nmos_to_tsl.direct_sources;
    let existing = list.find(d => d.base_url === info.base_url);
    if (!existing) {
      const srcDevId = 'gpisrc-' + Date.now();
      const bindings = (info.senders || []).map((s, i) => ({
        id: `${srcDevId}-b${i + 1}`,
        sender_id: s.id,
        sender_label: s.label,
        source_id: s.source_id || '',
        screen: 0,
        index: Math.floor(i / 2),
        role: (i % 2 === 0) ? 'red' : 'green',
        umd_text: 'CAM ' + (Math.floor(i / 2) + 1),
        invert: false,
        enabled: false
      }));
      existing = {
        id: srcDevId,
        label: label || info.node_label || info.base_url,
        base_url: info.base_url,
        enabled: true,
        bindings
      };
      list.push(existing);
    } else {
      syncN2TSourceSenders(existing, info.senders || []);
    }
    await saveN2TConfig(t('n2t_toast_probed', {n: (info.senders || []).length}));
  } catch (e) {
    showToast(t('toast_probe_err', {err: e.message}), true);
  }
}

function syncN2TSourceSenders(srcDev, senders) {
  const bySenderId = {};
  (srcDev.bindings || []).forEach(b => { bySenderId[b.sender_id] = b; });
  srcDev.bindings = senders.map((s, i) => {
    const prev = bySenderId[s.id];
    if (prev) {
      prev.sender_label = s.label || prev.sender_label;
      if (s.source_id) prev.source_id = s.source_id;
      return prev;
    }
    return {
      id: `${srcDev.id}-b${i + 1}-${Date.now()}`,
      sender_id: s.id,
      sender_label: s.label,
      source_id: s.source_id || '',
      screen: 0,
      index: Math.floor(i / 2),
      role: (i % 2 === 0) ? 'red' : 'green',
      umd_text: 'CAM ' + (Math.floor(i / 2) + 1),
      invert: false,
      enabled: false
    };
  });
}

function pushSnifferRow(pkt) {
  snifferRows.unshift(pkt);
  if (snifferRows.length > 100) snifferRows.length = 100;
  renderSnifferTable();
}

function clearSnifferTable() {
  snifferRows = [];
  renderSnifferTable();
}

function renderSnifferTable() {
  const tb = document.getElementById('snifferBody');
  if (!snifferRows.length) {
    tb.innerHTML = `<tr><td colspan="9" style="color:var(--muted)">${esc(t('sniff_empty'))}</td></tr>`;
    return;
  }
  tb.innerHTML = snifferRows.map(r => `
    <tr>
      <td class="mono">${new Date(r.timestamp).toLocaleTimeString()}</td>
      <td class="mono">${esc(r.source_addr)}</td>
      <td>${r.screen}</td>
      <td><b>${r.index}</b></td>
      <td><span class="tag-pill tag-${r.rh_tally}">${r.rh_tally}</span></td>
      <td><span class="tag-pill tag-${r.text_tally}">${r.text_tally}</span></td>
      <td><span class="tag-pill tag-${r.lh_tally}">${r.lh_tally}</span></td>
      <td class="mono">${esc(r.text || '')}</td>
      <td>${r.was_framed ? 'DLE/STX' : 'Raw UDP'}</td>
    </tr>`).join('');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function connectSSE() {
  const es = new EventSource('/api/v1/stream');
  es.onopen = () => {
    sseState = 'online';
    updateSSEBadge();
  };
  es.onerror = () => {
    sseState = 'reconnecting';
    updateSSEBadge();
  };
  es.addEventListener('status', e => renderStatus(JSON.parse(e.data)));
  es.addEventListener('channels', e => renderChannels(JSON.parse(e.data)));
  es.addEventListener('sniffer', e => pushSnifferRow(JSON.parse(e.data)));
  es.addEventListener('nmos2tsl', e => renderN2TSummary(JSON.parse(e.data)));
}

(async function init() {
  applyLang();
  try {
    const [st, sniff, cfg] = await Promise.all([
      api('/api/v1/status'),
      api('/api/v1/sniffer'),
      api('/api/v1/config')
    ]);
    appConfig = cfg;
    ensureN2TConfigDefaults();
    snifferRows = (sniff || []).reverse();
    renderStatus(st);
    renderSnifferTable();
    populateConfigForm();
    populateN2TConfigForm();
    renderTargetsSection(true);
    renderN2TSourcesSection(true);
